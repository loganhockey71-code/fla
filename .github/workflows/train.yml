name: train-models
# Trains + backtests a NEW model version per coin and makes it the active one. Run manually first (before any predictions
# exist), then only when you deliberately want a new version. Old versions stay in the database, and every prediction
# records which version made it.
on:
  workflow_dispatch:
    inputs:
      days: { description: "Days of history", default: "1095" }

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: worker/requirements.txt }
      - run: pip install -r worker/requirements.txt
      - run: python -m crypto_ai.cli train --days ${{ inputs.days }}
        working-directory: worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
