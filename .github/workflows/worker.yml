name: worker-tick
# Collects prices, reads news, detects sudden moves, scores old predictions, makes new ones, updates the fake account.
# FREE-MINUTES BUDGET: every 15 min is ~192 runs/day at ~2 min/run (~11,500 min/month) - well over the 2,000 free
# minutes/month a PRIVATE repo gets. This cadence needs the repo to be PUBLIC (unlimited free Actions minutes):
# Settings -> General -> Danger Zone -> Change visibility. If you ever make it private again, widen this back out
# (e.g. "7 * * * *" for hourly, ~1,500 min/month) or Actions will start failing once the free minutes run out.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency: { group: worker-tick, cancel-in-progress: false }

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: worker/requirements.txt }
      - run: pip install -r worker/requirements.txt
      - run: python -m crypto_ai.cli tick
        working-directory: worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
